        - paragraph [ref=e46]: Ezequiel López-Rubio is a Full Professor at the University of Málaga. His research interests include graph theory, machine learning, computer vision, and neural network architectures. He is the creator of the IsalGraph and IsalSR frameworks and the principal investigator of the ICAI research group.

        - paragraph [ref=e57]: Mario Pascual González is a PhD student at the University of Málaga working on graph representation learning and the IsalSR framework. His research focuses on canonical string representations for symbolic regression, search space reduction, and integration of graph-theoretic methods with existing SR algorithms.

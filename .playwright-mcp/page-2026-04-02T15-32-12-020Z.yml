          - paragraph [ref=e94]: 9-character alphabet for undirected simple graphs. Unlabeled nodes, no edge direction, no acyclicity constraint. Complete graph invariant for topology.
        - generic [ref=e95]:
          - heading "IsalSR" [level=3] [ref=e96]
          - paragraph [ref=e97]: 31-token alphabet for labeled DAGs. 14 operation types with arity constraints, directed edges with cycle detection, commutative encoding (SUB→ADD+NEG, DIV→MUL+INV). Complete labeled-DAG invariant for expressions.

# UDFS experiment on hard-tier benchmarks (10 problems)
# References:
#   docs/md_files/changes/hard_benchmark_proposal.md (2026-04-13)
#   benchmarks/datasets/hard.py
#
# Operator-set extension (sqrt, pow): justified per Plan-agent review.
# All other UDFS hyperparameters match production Nguyen/Feynman exactly.
# processes: 1 is REQUIRED — UDFS spawn-mode workers bypass the IsalSR monkeypatch.
#
# Korns-12 is subsampled to 2000 train / 2000 test (vs canonical 10k/10k) inside
# benchmarks.datasets.hard (n_*_override keys). Documented deviation.

experiment:
  name: udfs_hard
  method: udfs
  n_seeds: 30

benchmarks:
  hard:
    problems: all
    train_size: 1000      # Used by Feynman-extended (uniform); ignored by grid problems.
    test_size: 250

udfs:
  n_calc_nodes: 5
  max_orders: 200000
  max_time: 43200       # 12h algorithm budget (standard).
  processes: 1
  mode: hierarchical
  k: 2
  stop_thresh: 1.0e-10
  use_tan: false
  # Note: UDFS hardcodes its operator set inside DAGRegressor; this list is
  # informational only (UDFSConfig.to_dag_regressor_kwargs does not forward it).
  # UDFS's vendored ops include {+, -, *, /, sin, cos, exp, log, sqrt, inv, neg}
  # but no generic "pow" — powers are composed via repeated multiplication.
  operator_set: ["+", "*", "-", "/", "sin", "cos", "exp", "log", "sqrt"]
  snapshot_frequency: 1000

isalsr:
  canonicalization_timeout: 60.0
  use_fast_canonical: true

output:
  base_dir: /media/mpascual/Sandisk2TB/research/isalsr/results

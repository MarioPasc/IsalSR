# UDFS experiment on the ODE-Strogatz benchmarks (14 problems).
#
# These are SRBench's ground-truth track minus AI Feynman: the 14 two-state
# dynamic models of La Cava, Danai & Spector (2016), redistributed in PMLB.
# Added under T05 to answer reviewer comment R3.1.
#
# References:
#   docs/md_files/changes/r31_extension_selection.md   (pre-registered rule)
#   benchmarks/datasets/strogatz.py
#   benchmarks/datasets/data/strogatz/PROVENANCE.md
#
# Operator set: identical to udfs_hard.yaml / udfs_roundoff.yaml.  UDFS's
# vendored search has no generic `pow`, so the set is the hard-tier one minus
# `pow` — the same asymmetry the submitted campaign already carries.  Per
# EXECUTION-PLAN.md A4b the invariant that matters is that for a fixed
# (method, problem) the operator set is identical across all three arms.
#
# processes: 1 is REQUIRED — UDFS spawn-mode workers bypass the IsalSR
# monkeypatch (CLAUDE.md, "UDFS dedup verified correct").
#
# Seeds: 20, per EXECUTION-PLAN.md §0.4a.  Not 30 — read the boxed note in §0.4
# before changing this.
#
# train/test: the Strogatz datasets are PUBLISHED FIXED data (400 rows each),
# not generated.  300/100 is SRBench's 75/25 split; the per-problem `sampling`
# overrides in strogatz.py pin these sizes and the seed selects the split.

experiment:
  name: udfs_strogatz
  method: udfs
  n_seeds: 20

benchmarks:
  strogatz:
    problems: all
    train_size: 300
    test_size: 100

udfs:
  n_calc_nodes: 5
  max_orders: 200000
  max_time: 43200       # 12h algorithm budget (standard).
  processes: 1
  mode: hierarchical
  k: 2
  stop_thresh: 1.0e-10
  use_tan: false
  # Informational only: to_dag_regressor_kwargs() does not forward this field and
  # DAGRegressor has no such parameter. The search always enumerates the vendor's
  # own table (vendor/DAG_search/config.py, NODE_ARITY): binary {+, *, sub_l,
  # sub_r, div_l, div_r}, unary {id, inv, neg, sin, cos, exp, log, sqrt}, no pow.
  # The list below records that fixed set and is identical in every UDFS config.
  operator_set: ["+", "*", "-", "/", "sin", "cos", "exp", "log", "sqrt", "neg", "inv"]
  snapshot_frequency: 1000

isalsr:
  canonicalization_timeout: 60.0
  use_fast_canonical: true

output:
  base_dir: /media/mpascual/Sandisk2TB/research/isalsr/results

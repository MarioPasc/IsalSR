[build-system]
requires = [
    "scikit-build-core>=0.9",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
ninja.version = ">=1.10"
build-dir = "build/{wheel_tag}"
# wheel.packages must list the Python source tree; the .so is installed
# into isalsr/core/ by CMake's install() rule, not by this list.
# Only the library is distributed.  experiments/ and benchmarks/ are the
# paper's research code: they live in the repository (and the Code Ocean
# capsule), run from a checkout, and would otherwise land in site-packages as
# top-level packages with generic names that collide with other projects.
wheel.packages = ["src/isalsr"]
# The C++ sources live inside the package tree (src/isalsr/core/native/) so
# that the whole extension travels with the checkout, but only the compiled
# .so belongs in a wheel — ship no .cpp/.hpp.
wheel.exclude = ["isalsr/core/native/**"]
# The sdist carries what a source build needs (library, C++ engine, CMake),
# not the 5 MB research tree, the cluster scripts, or a test suite that
# imports that research tree.
sdist.exclude = [
    "experiments/", "benchmarks/", "slurm/", "tests/", "build/", ".hypothesis/",
    "run", "scaffold.sh",
]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

# Single source of truth for the version: isalsr.__version__.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/isalsr/__init__.py"

[project]
name = "isalsr"
dynamic = ["version"]
description = "Isomorphism-invariant instruction strings for the labeled DAGs of symbolic regression"
# PEP 621 requires the readme inside the project directory, so this is the
# package's own README (install, quick start, citation); the repository
# README at the root describes the project and the paper's experiments.
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ezequiel López-Rubio", email = "ezeqlr@lcc.uma.es"},
    {name = "Mario Pascual-González", email = "mpascual@uma.es"},
    {name = "Karl Thurnhofer-Hemsi", email = "karlkhader@uma.es"},
]
keywords = [
    "symbolic regression", "directed acyclic graph", "graph isomorphism",
    "canonical form", "Weisfeiler-Leman", "search-space reduction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Core has zero dependencies
dependencies = []

[project.urls]
Homepage = "https://mariopasc.github.io/IsalSR/"
Repository = "https://github.com/MarioPasc/IsalSR"
Issues = "https://github.com/MarioPasc/IsalSR/issues"

[project.optional-dependencies]
networkx = ["networkx>=3.0"]
sympy = ["sympy>=1.12"]
eval = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
]
search = [
    "numpy>=1.24",
]
viz = ["matplotlib>=3.7"]
bench = [
    "isalsr[networkx,sympy,eval,search,viz]",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]
native = [
    "nanobind>=2.0",
    "ninja>=1.10",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
experiments = [
    "isalsr[bench]",
    "bingo-nasa",
    "stopit",
    "zss",
    "tqdm",
    "statsmodels>=0.14",
    "scikit-posthocs>=0.9",
    "seaborn>=0.12",
    "torch",
    # critdd (critical-difference diagrams) is not on PyPI, and PyPI rejects
    # packages whose metadata names a direct URL dependency.  Install it
    # separately for the figure scripts:
    #   pip install "critdd @ git+https://github.com/mirkobunse/critdd"
    # (environment/postInstall pins the commit the paper's figures used).
]
all = ["isalsr[networkx,sympy,eval,search,viz,bench,dev,experiments]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project directory on sys.path: the tests import the research code
# (experiments/, benchmarks/) from the checkout, since the wheel ships only
# the library.
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (external libs)",
    "property: Property-based tests (hypothesis)",
    "slow: Long-running tests",
    "graphviz: Needs the Graphviz 'dot' binary (a system program); skipped where it is absent",
    "external_data: Reads inputs kept outside code/ (the docs/ tree at the repository root, or the campaign results); deselected in the Code Ocean capsule",
    "manuscript: Checks the LaTeX manuscript against the code; needs the manuscript checkout, which is not part of this repository",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "networkx", "networkx.*",
    "sympy", "sympy.*",
    "numpy", "numpy.*",
    "scipy", "scipy.*",
    "torch", "torch.*",
    "matplotlib", "matplotlib.*",
    "pandas", "pandas.*",
    "sklearn", "sklearn.*",
    "yaml", "yaml.*",
    "h5py", "h5py.*",
    "stopit", "stopit.*",
    "zss", "zss.*",
    "tqdm", "tqdm.*",
    "statsmodels", "statsmodels.*",
    "scikit_posthocs", "scikit_posthocs.*",
    "seaborn", "seaborn.*",
    "DAG_search", "DAG_search.*",
    "bingo", "bingo.*",
    "mpi4py", "mpi4py.*",
    "dill", "dill.*",
    "smcpy", "smcpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "isalsr.precomputed",
    "isalsr.precomputed.*",
]
disable_error_code = "import-untyped"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# E402: imports after pytest.importorskip() -- standard pattern for optional deps
"tests/integration/*.py" = ["E402"]
# Same pattern: the UDFS vendor dir must be on sys.path and torch checked before import
"tests/unit/test_udfs_adapter.py" = ["E402"]
# Same pattern again: pytest.importorskip guards the optional C++ extension, so
# the imports that depend on it must follow the guard.
"tests/unit/test_native_datastructures.py" = ["E402"]
"tests/unit/test_native_s2d.py" = ["E402"]
"tests/unit/test_native_canonical.py" = ["E402"]
# N802: test names may use uppercase instruction names (V, C, N, P, W)
# ANN: test functions/fixtures don't require type annotations
"tests/**/*.py" = ["N802", "ANN"]
# ANN: benchmark/experiment scripts use dynamic typing for flexibility
"benchmarks/**/*.py" = ["E402", "ANN"]
"experiments/**/*.py" = ["E402", "ANN"]

# ------------------------------------------------------------------
# Release wheels (cibuildwheel; .github/workflows/wheels.yml).
# ------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
# Windows: MSVC is not a supported compiler for the C++ engine (CMakeLists.txt),
# so Windows installs from the sdist and gets the pure-Python engine.
skip = "*-musllinux_* *_i686 *-win*"
test-sources = ["tests", "pyproject.toml", "README.md"]
test-requires = ["pytest", "hypothesis", "numpy"]
# Against the installed wheel: the C++ engine must be compiled in, and the
# canonical-string theorem, the frozen corpus and the property tests must pass.
test-command = [
    "python -c \"import isalsr, sys; sys.exit(0 if isalsr.engine() == 'cpp' else 'C++ engine missing from the wheel')\"",
    "python -m pytest tests/unit/test_canonical_theorem.py tests/unit/test_public_api.py tests/property -q -p no:cacheprovider -o addopts=",
]

[tool.cibuildwheel.linux]
# x86-64-v2 for distribution (no AVX2 requirement); ignored on aarch64.
environment = { SKBUILD_CMAKE_DEFINE = "ISALSR_MARCH=x86-64-v2" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", SKBUILD_CMAKE_DEFINE = "ISALSR_MARCH=x86-64-v2" }

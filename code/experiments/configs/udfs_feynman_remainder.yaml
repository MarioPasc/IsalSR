# UDFS experiment on the AI Feynman remainder (6 problems).
#
# The six equations were selected by the pre-registered, outcome-blind rule in
# docs/md_files/changes/r31_extension_selection.md and drawn by
# experiments/scripts/r31_draw_extension.py.  The drawn list is
# docs/md_files/changes/r31_extension_selection_draw.json.  Do not edit the
# problem set here — it is fixed by that draw, and editing it would void the
# pre-registration.
#
# References:
#   benchmarks/datasets/feynman_remainder.py
#   benchmarks/datasets/feynman_catalogue.py
#
# Operator set: identical to udfs_hard.yaml / udfs_roundoff.yaml / the strogatz
# configs.  UDFS's vendored search has no generic `pow`, so the set is the
# hard-tier one minus `pow` — the same asymmetry the submitted campaign already
# carries.  Per EXECUTION-PLAN.md A4b the invariant that matters is that for a
# fixed (method, problem) the operator set is identical across all three arms.
#
# processes: 1 is REQUIRED — UDFS spawn-mode workers bypass the IsalSR
# monkeypatch (CLAUDE.md, "UDFS dedup verified correct").
#
# Seeds: 30 (Mario, 2026-08-05).  This SUPERSEDES §0.4a's 20-seed decision and
# the boxed note in §0.4, whose premise was cost: that arithmetic assumed a 12 h
# run for both hosts.  Measured 2026-08-05 — UDFS saturates 12 h on 100 % of
# runs (n=600, mean=median=max=12.00 h) but Bingo does not (mean 5.15 h, median
# 4.04 h), so C2 costs ≈107,100 core-h at 30 seeds, not 151,200: 7.5 d at the
# measured 592 cores.  All 14 campaign configs must carry the SAME value —
# a split seed count silently unbalances the paired design (§5.5), which is
# worse than a smaller one.  Locked by tests/unit/test_budget_uniformity.py.

experiment:
  name: udfs_feynman_remainder
  method: udfs
  n_seeds: 30

benchmarks:
  feynman_remainder:
    problems: all
    train_size: 1000
    test_size: 250

udfs:
  n_calc_nodes: 5
  max_orders: 200000
  max_time: 43200       # 12h algorithm budget (standard).
  processes: 1
  mode: hierarchical
  k: 2
  stop_thresh: 1.0e-10
  use_tan: false
  # Informational only: to_dag_regressor_kwargs() does not forward this field and
  # DAGRegressor has no such parameter. The search always enumerates the vendor's
  # own table (vendor/DAG_search/config.py, NODE_ARITY): binary {+, *, sub_l,
  # sub_r, div_l, div_r}, unary {id, inv, neg, sin, cos, exp, log, sqrt}, no pow.
  # The list below records that fixed set and is identical in every UDFS config.
  operator_set: ["+", "*", "-", "/", "sin", "cos", "exp", "log", "sqrt", "neg", "inv"]
  snapshot_frequency: 1000
  # Shadow sketches OFF for the campaign (audit.md §7.3, Mario 2026-08-04).
  # They cost 17.6 % of Bingo's wall clock / 0.03 % of UDFS's, are paid by the
  # isalsr arm alone inside a fixed budget, and would penalise exactly the arm
  # carrying the headline claim.  The fixed-order numbers come from the Stage D
  # trace cell and the D3 replay instead.  Read by the isalsr/hash runners via
  # config.get("shadow_hash"); UDFSConfig.from_dict filters it out of the
  # dataclass, so it perturbs no host parameter.
  shadow_hash: false

isalsr:
  canonicalization_timeout: 60.0
  use_fast_canonical: true

output:
  base_dir: /media/mpascual/Sandisk2TB/research/isalsr/results

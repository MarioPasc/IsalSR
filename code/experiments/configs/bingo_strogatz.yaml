# Bingo experiment on the ODE-Strogatz benchmarks (14 problems).
#
# These are SRBench's ground-truth track minus AI Feynman: the 14 two-state
# dynamic models of La Cava, Danai & Spector (2016), redistributed in PMLB.
# Added under T05 to answer reviewer comment R3.1.
#
# References:
#   docs/md_files/changes/r31_extension_selection.md   (pre-registered rule)
#   benchmarks/datasets/strogatz.py
#   benchmarks/datasets/data/strogatz/PROVENANCE.md
#
# Operator set: identical to bingo_hard.yaml / bingo_roundoff.yaml (sqrt, pow
# included).  Per EXECUTION-PLAN.md A4b the D2 tier adopts the hard-tier set;
# the invariant that matters is that for a fixed (method, problem) the operator
# set is identical across the baseline, hash and isalsr arms.
#
# Seeds: 30 (Mario, 2026-08-05).  This SUPERSEDES §0.4a's 20-seed decision and
# the boxed note in §0.4, whose premise was cost: that arithmetic assumed a 12 h
# run for both hosts.  Measured 2026-08-05 — UDFS saturates 12 h on 100 % of
# runs (n=600, mean=median=max=12.00 h) but Bingo does not (mean 5.15 h, median
# 4.04 h), so C2 costs ≈107,100 core-h at 30 seeds, not 151,200: 7.5 d at the
# measured 592 cores.  All 14 campaign configs must carry the SAME value —
# a split seed count silently unbalances the paired design (§5.5), which is
# worse than a smaller one.  Locked by tests/unit/test_budget_uniformity.py.
#
# train/test: the Strogatz datasets are PUBLISHED FIXED data (400 rows each),
# not generated.  300/100 is SRBench's 75/25 split; the per-problem `sampling`
# overrides in strogatz.py pin these sizes and the seed selects the split.

experiment:
  name: bingo_strogatz
  method: bingo
  n_seeds: 30

benchmarks:
  strogatz:
    problems: all
    train_size: 300
    test_size: 100

bingo:
  population_size: 500
  stack_size: 32
  operators: ["+", "-", "*", "/", "sin", "cos", "exp", "log", "sqrt", "pow"]
  use_simplification: false
  crossover_prob: 0.4
  mutation_prob: 0.4
  max_generations: 100000
  max_time: 43200       # 12h algorithm budget (standard).
  # F-19 (2026-08-05): this key was ABSENT and the suite silently inherited
  # BingoConfig.max_evals = 10_000_000 (config.py:29) -- a 10x tighter budget
  # than nguyen/feynman/hard/cherrypicked, undocumented, and pooled into the
  # N=70 CPDT. max_evals is the BINDING budget for Bingo (max_time never fires;
  # Stage D 2026-08-05), so this was a 10x search-budget disparity, not a detail.
  max_evals: 100000000
  fitness_metric: "lm"
  convergence_check_frequency: 50
  snapshot_frequency: 50
  # Shadow sketches OFF for the campaign (audit.md §7.3, Mario 2026-08-04).
  # They cost 17.6 % of Bingo's wall clock / 0.03 % of UDFS's, are paid by the
  # isalsr arm alone inside a fixed budget, and would penalise exactly the arm
  # carrying the headline claim.  The fixed-order numbers come from the Stage D
  # trace cell and the D3 replay instead.  Read by the isalsr/hash runners via
  # config.get("shadow_hash"); BingoConfig.from_dict filters it out of the
  # dataclass, so it perturbs no host parameter.
  shadow_hash: false

isalsr:
  canonicalization_timeout: 60.0
  use_fast_canonical: true

output:
  base_dir: /media/mpascual/Sandisk2TB/research/isalsr/results

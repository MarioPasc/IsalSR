# Mock config for the chunked-worker exercise: 3 Nguyen problems, tiny budgets.
experiment:
  name: mock_bingo_nguyen
  method: bingo
  n_seeds: 3

benchmarks:
  nguyen:
    problems: Nguyen-1,Nguyen-2,Nguyen-3

hyperparameters:
  population_size: 20
  stack_size: 12
  crossover_prob: 0.4
  mutation_prob: 0.4
  max_time: 8
  max_evals: 20000
  snapshot_frequency: 1000
